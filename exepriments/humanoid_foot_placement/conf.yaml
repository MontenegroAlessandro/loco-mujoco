defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

wandb:
  project: "Humanoid Foot Placement - LL Controller"

experiment:
  task_factory:
    name: RLFactory
    params: {}
  env_params:
    env_name: MjxBoosterT1
    horizon: 1000
    terminal_state_type: HeightBasedTerminalStateHandler
    goal_type: GoalRandomFootPlacement
    goal_params:
      visualize_goal: true
      # Names of the foot sites from the booster_t1_dfki.xml file
      left_foot_site_name: left_foot
      right_foot_site_name: right_foot
      # Range for the random step length [min, max] in meters
      xy_distance_range: [0.15, 0.35]
      # Range for the target foot height [min, max] from the ground
      z_height_range: [0.05, 0.15]
      # Range for omnidirectional step angle [-180, 180] for a full circle
      angle_range_deg: [-200.0, 200.0]
      # Range for randomizing the target foot yaw relative to the body
      yaw_range_deg: [-15.0, 15.0]
    headless: true
    reward_type: FootPlacementReward
    reward_params:
      # Site names are needed for the reward to know which foot to track
      left_foot_site_name: left_foot
      right_foot_site_name: right_foot
      # Relative importance of achieving the target position
      pos_tracking_weight: 10.0
      # Relative importance of achieving the target orientation
      orn_tracking_weight: 5.0
      # Relative importance of maintaining a stable, upright posture
      stability_weight: 5.0
      # Penalty for jerky, high-frequency actions to encourage smoothness
      action_rate_weight: 0.01
      # Controls how quickly the position reward falls off with distance
      pos_error_sharpness: 10.0
      # Controls how quickly the orientation reward falls off with angular error
      orn_error_sharpness: 20.0
      # Controls how quickly the stability reward falls off with height error
      height_error_sharpness: 15.0
  # PPO params
  hidden_layers: [512, 256]
  lr: 1e-4
  num_envs: 2048
  num_steps: 50
  total_timesteps: 10e7
  update_epochs: 4
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.8
  learnable_std: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: relu 
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1 
  vmap_across_seeds: true
  validation:
    active: false
    num_steps: 100
    num_envs: 100
    num: 10 
  power_mean:
    use_pm: true
    clip: true
    confidence: 0.2
    window: 1