init_state_params:
  qpos_init: [ 0, 0, 0.663,
               1, 0, 0, 0,
               0, 0,
               0.2,-1.2, 0, -0.5,
               0.2, 1.2, 0, 0.5,
               0,
               -0.2, 0, 0, 0.5, -0.25, 0,
               -0.2, 0, 0, 0.5, -0.25, 0 ]
