               0, 0, 0, 0, 0, 0 ]

num_actions: 23

command:
  feet_distance: 0.2
  gait_frequency: 1.0
  stop_steps: 4
  is_gp_adaptive: false
  max_gp_delta: 0.04
  min_gp_delta: 0.01

obs:
  obs_coordinates: [7.0, 0.0, 0.0]

# -------------------------
# Goal reached condition
# -------------------------
reach:
  threshold: 0.20
  hold_steps: 15

eval:
  n_trials: 100
  render: true


# -------------------------
# Fixed Arena with cones
# -------------------------
arena:
  n_cones: 20

  field:
    x_range: [1.0, 7.0]
    y_range: [-3.0, 3.0]

  # goal on the other side
  goal:
    pos: [8.0, 0.0, 0.0]

  # carve an exit corridor (no cones placed inside)
  corridor:
    x_min: -2.1
    x_max: 0.2
    center_y: 0.0
    half_w: 0.30

  # dense cone pile near start
  start_field:
    n_cones: 45
    x_range: [-3.0, -1.6]
    y_range: [-1.4, 1.4]
    carve_corridor: true

    # placement spacing controls
    clearance: 0.02
    robot_width_for_spacing: 0.0
    start_clearance: 0.60
    max_tries: 2000


