# --- Policy Parameters ---
num_actions: 29 # Base number of actions (one per joint). Script will handle varstiff extension.

# --- Command Parameters (for generating the `cmd` vector) ---
# These are default command values. The valid ranges are in the comments.
command:
  distance: 0.2
  gait_frequency: 1.0   # Target gait frequency in Hz (Range: 0.5 to 1.5)

  