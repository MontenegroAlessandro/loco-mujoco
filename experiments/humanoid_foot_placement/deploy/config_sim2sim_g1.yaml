hydra:
  job:
    chdir: false

# Configuration for deploying the Unitree G1 policy in a MuJoCo simulation.
# All paths are relative to the repository root.

# policy parameters
agent_path: experiments/humanoid_foot_placement/policies/G1/g1_flat.pkl
train_config_path: experiments/humanoid_foot_placement/train/
train_config_name: conf_g1.yaml
# --- Simulation Parameters ---
xml_path: loco_mujoco/models/unitree_g1/g1_29dof_original.xml
simulation_duration: 300.0 # seconds
simulation_dt: 0.002 # seconds, physics timestep
control_decimation: 10 # policy will run every N physics steps (policy freq = 1 / (dt * decimation))

# --- PD Control Gains (for 29 actuated joints) ---
lmj_kps:
  - 100
  - 100
  - 100
  - 150 
  - 20
  - 20
  - 100
  - 100
  - 100
  - 150 
  - 20
  - 20
  - 100 # waist yaw
  - 100 # waist roll
  - 100 # waist pitch
  - 30
  - 30
  - 30
  - 30
  - 30
  - 10
  - 10
  - 30
  - 30
  - 30
  - 30
  - 30
  - 10
  - 10
lmj_kds:
  - 2
  - 2
  - 2
  - 3
  - 1
  - 1
  - 2
  - 2
  - 2
  - 3
  - 1
