hydra:
  job:
    chdir: false

# Configuration for deploying the Booster T1 policy in a MuJoCo simulation.
# All paths are relative to the repository root.

# seed for sample start point and goal point
seed: 0

# policy parameters
agent_path: experiments/humanoid_foot_placement/policies/T1/t1_flat.pkl

# Simulation Parameters
xml_path: loco_mujoco/models/booster_t1/booster_t1.xml
simulation_duration: 300.0
simulation_dt: 0.002
control_decimation: 10

# --- PD Control Gains (for 23 actuated joints) ---
# Joint Order:
# - AAHead_yaw, Head_pitch
# - Left_Shoulder_Pitch, Left_Shoulder_Roll, Left_Elbow_Pitch, Left_Elbow_Yaw
# - Right_Shoulder_Pitch, Right_Shoulder_Roll, Right_Elbow_Pitch, Right_Elbow_Yaw
# - Waist
# - Left_Hip_Pitch, Left_Hip_Roll, Left_Hip_Yaw, Left_Knee_Pitch, Left_Ankle_Pitch, Left_Ankle_Roll
# - Right_Hip_Pitch, Right_Hip_Roll, Right_Hip_Yaw, Right_Knee_Pitch, Right_Ankle_Pitch, Right_Ankle_Roll

scale_action_to_jnt_limits: false

lmj_kps:
  - 10 # 40 # AAHead_yaw
  - 10 # 40 # Head_pitch
  - 20 # 40 # Left_Shoulder_Pitch
  - 20 # 40 # Left_Shoulder_Roll
  - 20 # 40 # Left_Elbow_Pitch
  - 20 # 40 # Left_Elbow_Yaw
  - 20 # 40 # Right_Shoulder_Pitch
  - 20 # 40 # Right_Shoulder_Roll
  - 20 # 40 # Right_Elbow_Pitch
  - 20 # 40 # Right_Elbow_Yaw
  - 150 # Waist
  - 120 # Left_Hip_Pitch
  - 120 # Left_Hip_Roll
  - 120 # Left_Hip_Yaw
  - 120 # Left_Knee_Pitch
  - 30 # Left_Ankle_Pitch
  - 30 # Left_Ankle_Roll
  - 120 # Right_Hip_Pitch
  - 120 # Right_Hip_Roll
  - 120 # Right_Hip_Yaw
  - 120 # Right_Knee_Pitch
  - 30 # Right_Ankle_Pitch
  - 30 # Right_Ankle_Roll
lmj_kds:
  - 1.0 # 2.0 # AAHead_yaw
  - 1.0 # 2.0 # Head_pitch
  - 0.5 # 2.0 # Left_Shoulder_Pitch
  - 0.5 # 2.0 # Left_Shoulder_Roll
  - 0.5 # 2.0 # Left_Elbow_Pitch
  - 0.5 # 2.0 # Left_Elbow_Yaw
  - 0.5 # 2.0 # Right_Shoulder_Pitch
  - 0.5 # 2.0 # Right_Shoulder_Roll
  - 0.5 # 2.0 # Right_Elbow_Pitch
  - 0.5 # 2.0 # Right_Elbow_Yaw
  - 5.0 # Waist
  - 5.0 # Left_Hip_Pitch
  - 5.0 # Left_Hip_Roll
  - 5.0 # Left_Hip_Yaw
  - 5.0 # Left_Knee_Pitch
  - 5.0 # 1.0 # Left_Ankle_Pitch
  - 5.0 # 1.0 # Left_Ankle_Roll
  - 5.0 # Right_Hip_Pitch
  - 5.0 # Right_Hip_Roll
  - 5.0 # Right_Hip_Yaw
  - 5.0 # Right_Knee_Pitch
  - 5.0 # 1.0 # Right_Ankle_Pitch
  - 5.0 # 1.0 # Right_Ankle_Roll

# --- Robot Pose and Limits (23 joints) ---
default_angles:
  - 0.0   # AAHead_yaw
  - 0.0   # Head_pitch
  - 0.2   # Left_Shoulder_Pitch
  - -1.2 # Left_Shoulder_Roll
  - 0.0   # Left_Elbow_Pitch
  - -0.5  # Left_Elbow_Yaw
  - 0.2   # Right_Shoulder_Pitch
  - 1.2  # Right_Shoulder_Roll
  - 0.0   # Right_Elbow_Pitch
  - 0.5   # Right_Elbow_Yaw
  - 0.0   # Waist
  - -0.2  # Left_Hip_Pitch
  - 0.0   # Left_Hip_Roll
  - 0.0   # Left_Hip_Yaw
  - 0.5   # Left_Knee_Pitch
  - -0.25 # Left_Ankle_Pitch
  - 0.0   # Left_Ankle_Roll
  - -0.2  # Right_Hip_Pitch
  - 0.0   # Right_Hip_Roll
  - 0.0   # Right_Hip_Yaw
  - 0.5   # Right_Knee_Pitch
  - -0.25 # Right_Ankle_Pitch
  - 0.0   # Right_Ankle_Roll

min_angles:
  - -1.57 # AAHead_yaw
  - -0.35 # Head_pitch
  - -3.31 # Left_Shoulder_Pitch
  - -1.74 # Left_Shoulder_Roll
  - -2.27 # Left_Elbow_Pitch
  - -2.44 # Left_Elbow_Yaw
  - -3.31 # Right_Shoulder_Pitch
  - -1.57 # Right_Shoulder_Roll
  - -2.27 # Right_Elbow_Pitch
  - 0.0   # Right_Elbow_Yaw
  - -1.57 # Waist
  - -1.8  # Left_Hip_Pitch
  - -0.2  # Left_Hip_Roll
  - -1.0  # Left_Hip_Yaw
  - 0.0   # Left_Knee_Pitch
  - -0.87 # Left_Ankle_Pitch
  - -0.44 # Left_Ankle_Roll
  - -1.8  # Right_Hip_Pitch
  - -1.57 # Right_Hip_Roll
  - -1.0  # Right_Hip_Yaw
  - 0.0   # Right_Knee_Pitch
  - -0.87 # Right_Ankle_Pitch
  - -0.44 # Right_Ankle_Roll

max_angles:
  - 1.57  # AAHead_yaw
  - 1.22  # Head_pitch
  - 1.22  # Left_Shoulder_Pitch
  - 1.57  # Left_Shoulder_Roll
  - 2.27  # Left_Elbow_Pitch
  - 0.0   # Left_Elbow_Yaw
  - 1.22  # Right_Shoulder_Pitch
  - 1.74  # Right_Shoulder_Roll
  - 2.27  # Right_Elbow_Pitch
  - 2.44  # Right_Elbow_Yaw
  - 1.57  # Waist
  - 1.57  # Left_Hip_Pitch
  - 1.57  # Left_Hip_Roll
  - 1.0   # Left_Hip_Yaw
  - 2.34  # Left_Knee_Pitch
  - 0.35  # Left_Ankle_Pitch
  - 0.44  # Left_Ankle_Roll
  - 1.57  # Right_Hip_Pitch
  - 0.2   # Right_Hip_Roll
  - 1.0   # Right_Hip_Yaw
  - 2.34  # Right_Knee_Pitch
  - 0.35  # Right_Ankle_Pitch
  - 0.44  # Right_Ankle_Roll

# --- Policy Parameters ---
num_actions: 23 # Base number of actions (one per joint). Script will handle varstiff extension.

# --- Command Parameters (for generating the `cmd` vector) ---
# These are default command values. The valid ranges are in the comments.
command:
  feet_distance: 0.2
  gait_frequency: 1.0
  stop_steps: 2


# TASK: Narrow Path Configuration
task:
  name: narrow_path
  mode: bridge          # bridge

  # Robot spawn: FORCE on left platform
  spawn_on_platform: true
  start_xy: [-2.0, 0.0]  # left platform center
  goal_xy:  [ 2.0, 0.0]  # right platform center

  # Reach condition for waypoint following
  reach_thresh: 0.25
  reach_hold_steps: 12

  # Geometry: platforms and path
  platform:
    half_xy: [0.9, 0.9]     # platform half size in x/y
    half_z: 0.25            # platform half height -> top_z = 2*half_z
    rgba: [0.22, 0.22, 0.26, 1.0]

  path:
    width: 0.24
    thickness: 0.05
    extra_height: 0.0      # path_top_z = platform_top_z + extra_height
    rgba: [0.55, 0.45, 0.25, 1.0]

  # Falling detection: if base_z < platform_top_z - fall_margin
  fall_margin: 0.35

  anchors:
    edge_epsilon: 0.01

  modes:
    bridge:
      waypoints_xy: []