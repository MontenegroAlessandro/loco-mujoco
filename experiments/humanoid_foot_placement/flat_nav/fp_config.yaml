# --- Policy Parameters ---
num_actions: 23 # Base number of actions (one per joint). Script will handle varstiff extension.

# --- Command Parameters (for generating the `cmd` vector) ---
# These are default command values. The valid ranges are in the comments.
command:
  feet_distance: 0.25
  gait_frequency: 1.0
  stop_steps: 2
  step_spacing: 0.35 # [0.2, 0.4]
  step_height: 0.11 # max 0.12 (also 13!!)
  direction: 1 # 1 for forward, -1 for backward
  yaw_off: 0.0
  mode: fast